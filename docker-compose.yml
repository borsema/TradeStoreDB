services:
  api:
    build: .
    ports:
      - "1000:1000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///trade_store.db}
    volumes:
      - trade_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1000/api/v1/trades')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  trade_data:
