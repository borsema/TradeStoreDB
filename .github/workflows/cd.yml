name: Trade Store CD

on:
  push:
    branches: [main, master]

# Prevent concurrent deploys
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build & push Docker image to GitHub Container Registry (GHCR)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Deploy to server via SSH
  #    Requires these GitHub Secrets:
  #      DEPLOY_HOST     — IP or hostname of your server
  #      DEPLOY_USER     — SSH user (e.g. ubuntu, ec2-user)
  #      DEPLOY_SSH_KEY  — private SSH key (contents of ~/.ssh/id_rsa)
  #      SECRET_KEY      — Flask secret key for production
  #      DATABASE_URL    — (optional) production DB URI
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Pull latest image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest

            # Stop and remove old container
            docker stop trade-store-api 2>/dev/null || true
            docker rm   trade-store-api 2>/dev/null || true

            # Run new container
            docker run -d \
              --name trade-store-api \
              --restart unless-stopped \
              -p 1000:1000 \
              -e FLASK_ENV=production \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -v trade_data:/app/data \
              ghcr.io/${{ github.repository }}:latest

            # Wait for health check
            sleep 5
            docker ps | grep trade-store-api

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            curl -sf http://localhost:1000/api/v1/trades \
              && echo "✅ Deployment verified" \
              || (echo "❌ Health check failed" && exit 1)
